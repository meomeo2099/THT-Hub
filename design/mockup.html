<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>THT Hub · Mockup</title>
<style>
:root{
  --bg:#DCE3EC; --bg2:#E8EDF3; --card:#F7F9FC; --card2:#FFFFFF; --line:#D3DBE6;
  --text:#18202B; --sub:#6B7686; --blue:#1F6BF2; --blue-soft:#DCE7FB; --green:#22A55B; --red:#E5484D;
  --nav-sel:#E6ECF5; --shadow:0 2px 10px rgba(30,50,90,.06);
}
.dark{
  --bg:#141A22; --bg2:#1A212B; --card:#212A36; --card2:#273141; --line:#2E3949;
  --text:#EEF2F8; --sub:#93A0B2; --blue:#4C8DFF; --blue-soft:#24375A; --nav-sel:#1E2938; --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:720px;overflow:hidden;font-family:"Segoe UI","Roboto",system-ui,sans-serif;color:var(--text);background:var(--bg)}
.screen{position:relative;width:1920px;height:720px;background:var(--bg);overflow:hidden}
/* ảnh xe Coolray bên phải, mờ dần sang trái */
.hero{position:absolute;right:0;top:50px;width:1120px;height:642px;background:url(coolray-day.webp) right/cover no-repeat;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 38%);mask-image:linear-gradient(to right,transparent 0,#000 38%);opacity:.95}
.dark .hero{background-image:url(coolray-night.webp);opacity:.55}
/* thanh hệ thống gốc của xe (50 px trên) – vẽ mờ để thấy vùng chiếm */
.sys{position:absolute;left:0;top:0;width:1920px;height:50px;display:flex;align-items:center;padding:0 36px;gap:28px;font-size:20px;color:var(--sub);z-index:5}
.sys .r{margin-left:auto;display:flex;gap:30px;align-items:center}
/* menu trái */
.nav{position:absolute;left:0;top:70px;width:330px;z-index:3}
.nav a{display:flex;align-items:center;gap:20px;height:70px;padding-left:40px;font-size:24px;color:var(--text);text-decoration:none;border-left:5px solid transparent}
.nav a.on{color:var(--blue);background:linear-gradient(90deg,var(--nav-sel),transparent);border-left-color:var(--blue)}
.nav svg{width:28px;height:28px}
.content{position:absolute;left:370px;top:70px;z-index:3}
.cap{font-size:17px;color:var(--sub);margin:4px 0 12px;letter-spacing:.2px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:330px 330px;gap:16px}
.big{grid-column:span 2;padding:24px 28px;display:flex;gap:30px;align-items:center;height:220px}
.big .t{font-size:21px}
.big .v{font-size:76px;font-weight:700;color:var(--blue);line-height:1.05}
.big .v small{font-size:32px;margin-left:4px}
.big .s{font-size:17px;color:var(--sub);margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--line);margin:18px 0 10px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:4px}
.row2{display:flex;justify-content:space-between;font-size:16px;color:var(--sub)}
.tank{width:96px;height:160px;border:4px solid var(--text);border-radius:18px;position:relative;overflow:hidden;flex:none}
.tank::before{content:"";position:absolute;left:28px;top:-4px;width:32px;height:10px;background:var(--bg);}
.tank i{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(#5D9BFF,#1F6BF2)}
.mini{display:flex;gap:18px;align-items:center;padding:18px 22px;height:118px}
.ico{width:56px;height:56px;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center;flex:none}
.ico svg{width:30px;height:30px;color:var(--blue)}
.mini .t{font-size:17px;color:var(--sub)}
.mini .v{font-size:38px;font-weight:700}
.mini .v small{font-size:18px;font-weight:600;color:var(--sub);margin-left:4px}
.okbar{height:6px;border-radius:3px;background:var(--green);margin-top:6px;width:200px}
.pill{position:absolute;right:30px;top:62px;z-index:4;background:var(--card2);border-radius:14px;padding:12px 18px;font-size:16px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
/* nút chọn nhóm và công tắc */
.seg{display:flex;gap:8px}
.seg b{width:150px;height:62px;display:grid;place-items:center;background:var(--card2);border-radius:10px;font-weight:500;font-size:19px}
.seg b.on{background:var(--blue);color:#fff}
.tg{display:flex;gap:18px;align-items:flex-start;margin:18px 0}
.sw{width:46px;height:28px;border-radius:7px;background:#C9D1DC;position:relative;flex:none;margin-top:2px}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:5px;background:#fff}
.sw.on{background:var(--blue)}.sw.on::after{left:22px}
.dark .sw{background:#3A4657}
.tg .t{font-size:20px}.tg .s{font-size:15px;color:var(--sub);margin-top:3px}
.btn{height:60px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:500}
.btn.w{background:var(--card2);color:var(--text)}
.sel{height:62px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:19px}
.sel span{color:var(--sub)}
/* bảng điều khiển nhanh (lớp nổi từ mép dưới) */
.scrim{position:absolute;inset:0;background:rgba(15,25,40,.28);z-index:8}
.sheet{position:absolute;left:160px;right:0;bottom:0;height:450px;z-index:9;border-radius:30px 30px 0 0;
  background:rgba(240,244,249,.94);backdrop-filter:blur(30px);box-shadow:0 -10px 40px rgba(20,40,80,.18);padding:16px 34px 0}
.dark .sheet{background:rgba(28,36,48,.95)}
.grab{width:120px;height:7px;border-radius:4px;background:#AEB8C6;margin:0 auto 12px}
.sh{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.sh h3{font-size:24px;font-weight:600}
.sh .st{font-size:17px;color:var(--sub);margin-left:12px}
.sh .x{margin-left:auto;display:flex;gap:10px}
.round{width:52px;height:52px;border-radius:14px;background:var(--card2);display:grid;place-items:center}
.round svg{width:26px;height:26px}
.ctl{display:flex;gap:14px;align-items:stretch}
.ctl .blk:first-child:last-child{flex:1}
.blk{background:var(--card2);border-radius:20px;padding:16px 18px}
.blk .h{font-size:16px;color:var(--sub);margin-bottom:10px}
.tile{width:104px;height:96px;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:16px;color:var(--sub)}
.tile svg{width:32px;height:32px;color:var(--text)}
.tile.on{background:var(--blue);color:#fff}.tile.on svg{color:#fff}
.tiles{display:flex;gap:10px}
.dial{display:flex;align-items:center;gap:10px}
.step{width:58px;height:96px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:34px;font-weight:300}
.val{width:118px;text-align:center}
.val b{font-size:46px;font-weight:700}.val b small{font-size:20px;font-weight:500;color:var(--sub)}
.val div{font-size:15px;color:var(--sub)}
.fanbar{display:flex;gap:4px;justify-content:center;margin-top:6px}
.fanbar i{width:8px;height:14px;border-radius:2px;background:var(--line)}
.fanbar i.on{background:var(--blue)}
/* thanh nhạc nổi */
.music{position:absolute;z-index:7;left:1310px;top:560px;width:560px;height:96px;border-radius:48px;background:rgba(250,252,255,.92);
  backdrop-filter:blur(24px);box-shadow:0 8px 30px rgba(20,40,80,.18);display:flex;align-items:center;padding:0 14px;gap:14px}
.dark .music{background:rgba(33,42,54,.94)}
.art{width:70px;height:70px;border-radius:50%;background:conic-gradient(from 200deg,#1F6BF2,#7FB0FF,#9C7BFF,#1F6BF2);display:grid;place-items:center}
.art::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--card2)}
.mt{flex:1;min-width:0}.mt b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mt span{font-size:15px;color:var(--sub)}
.mb{width:56px;height:56px;border-radius:50%;display:grid;place-items:center}.mb svg{width:28px;height:28px}
.mb.p{background:var(--blue);color:#fff}
.prog{position:absolute;left:96px;right:200px;bottom:12px;height:3px;background:var(--line);border-radius:2px}.prog i{display:block;width:42%;height:100%;background:var(--blue);border-radius:2px}
/* tay kéo nhỏ ở mép dưới */
.handle{position:absolute;left:880px;bottom:6px;width:160px;height:8px;border-radius:4px;background:rgba(120,135,155,.75);z-index:6}
/* thanh OEM của xe (trái) – vẽ mờ */
.oem{position:absolute;left:0;top:50px;width:160px;height:670px;background:rgba(160,172,188,.18);z-index:2}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;background:#1B2330;color:#fff;border-radius:20px;padding:10px 22px;font-size:16px;z-index:10}
.note{position:absolute;right:30px;bottom:20px;font-size:14px;color:var(--sub);z-index:4}
/* trang icon */
.icons{display:flex;gap:80px;align-items:center;justify-content:center;height:720px;background:var(--bg)}
.ic{display:flex;flex-direction:column;align-items:center;gap:20px;font-size:20px;color:var(--sub)}
</style>
</head>

</template>

<template id="t-start">

  <div class="content" style="width:720px">
    <div class="cap">Kịch bản khi nổ máy</div>
    <div class="tg"><div class="sw on"></div><div><div class="t">Chạy khi nổ máy</div><div class="s">Một lần mỗi khi máy chuyển từ tắt sang nổ, kể cả khi đầu xe vừa khởi động</div></div></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="sel">Nhiệt độ <span>24,5 °C ›</span></div>
      <div class="sel">Chờ trước khi chạy <span>5 giây ›</span></div>
      <div class="sel">Mở app <span>Vietmap Live ›</span></div>
      <div class="sel">Phát nhạc <span>Bật ›</span></div>
    </div>
    <div class="btn" style="margin-top:18px">Chạy thử ngay</div>
  </div>
  <div class="toast">Đã áp dụng: Comfort · AUTO 24,5 °C</div>

<script>
const q = new URLSearchParams(location.search);
const view = q.get('v') || 'overview';
const dark = q.get('dark') === '1';
const root = document.getElementById('root');
const T = id => document.getElementById('t-' + id).content.cloneNode(true);
if (view === 'icon') { root.appendChild(T('icon')); }
else {
  const s = document.createElement('div'); s.className = 'screen' + (dark ? ' dark' : '');
  if (dark) document.body.classList.add('dark');
  s.appendChild(T('sys')); s.appendChild(T('nav'));
  const page = view === 'sheet' ? 'overview' : view;
  s.appendChild(T(page));
  s.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.k === (view === 'sheet' ? 'panel' : page)));
  if (view === 'sheet') s.appendChild(T('sheet'));
  else { s.appendChild(T('music')); const h = document.createElement('div'); h.className = 'handle'; s.appendChild(h); }
  root.appendChild(s);
}
</script>
