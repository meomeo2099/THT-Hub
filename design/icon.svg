<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A95FF"/>
      <stop offset="1" stop-color="#1A56D9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B2A6B" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- nền bo góc kiểu Flyme -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#gloss)"/>
  <!-- chữ H ghép từ hai thanh trượt -->
  <g filter="url(#sh)">
    <rect x="70" y="58" width="22" height="140" rx="11" fill="#FFFFFF" fill-opacity=".55"/>
    <rect x="164" y="58" width="22" height="140" rx="11" fill="#FFFFFF" fill-opacity=".55"/>
    <rect x="70" y="117" width="116" height="22" rx="11" fill="#FFFFFF"/>
    <circle cx="81" cy="92" r="23" fill="#FFFFFF"/>
    <circle cx="175" cy="164" r="23" fill="#FFFFFF"/>
    <circle cx="81" cy="92" r="9" fill="#2A6CF0"/>
    <circle cx="175" cy="164" r="9" fill="#2A6CF0"/>
  </g>
</svg>
